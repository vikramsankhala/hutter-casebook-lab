<header class="top"><div><h1>Hutter Casebook Lab: a case-by-case code walkthrough</h1><p>For your own understanding, and for standing up and teaching it. Written in plain language. Vikram Singh Sankhala, Solinexta AI.</p></div><button id="menu" aria-expanded="false">Contents</button></header>
<div class="layout"><nav id="nav" aria-label="Contents"></nav><main id="main"></main></div>
<script>
const C={};
C[1]={t:'The contest and the contract',ch:'Chapter 1',exp:'E01',cmd:'python -m experiments.e01_baselines',
files:[['hcl/corpus.py','Builds the test text. A seeded generator that writes Wikipedia-style markup, so every run sees the same bytes.'],['experiments/common.py','Two helpers: <code>get_data(n)</code> hands every experiment the same slice; <code>save()</code> writes the result file.'],['experiments/e01_baselines.py','Compresses the slice with zlib, bzip2 and xz, so we know what ordinary tools achieve.']],
breath:'Before you build anything clever, you need a fixed test file, a fixed way of scoring, and a few ordinary compressors to measure yourself against. This case sets up all three.',
steps:['<b>The test file is made, not downloaded.</b> <code>corpus.generate(seed=7)</code> writes 70 fake articles with infoboxes, links, citations, number tables and revised copies of earlier pages. Because the seed is fixed, anyone who runs it gets identical bytes. <code>manifest()</code> records a SHA-256 fingerprint so you can prove it.','<b>Every experiment asks for its data in one place.</b> <code>get_data(n)</code> returns the first <i>n</i> bytes. If you set the environment variable <code>HCL_ENWIK</code> to a real enwik8 file, the very same call returns a real slice. Nothing else in the code needs to change.','<b>E01 runs three off-the-shelf compressors</b> on 100,000 bytes. They are the referee: if your idea cannot beat them, it is not yet interesting.','<b>Notice what the code does not do.</b> It reports the compressed size only. The real Prize adds the size of the decompressor to the total. The repository never forgets this: it appears again in Case 14 (a program that generates data) and Case 18 (the distance-to-prize tool).'],
code:[['The three referees','experiments/e01_baselines.py','res["zlib9_bytes"] = len(zlib.compress(d, 9))\nres["bz2_bytes"] = len(bz2.compress(d, 9))\nres["xz_bytes"] = len(lzma.compress(d, preset=9 | lzma.PRESET_EXTREME))']],
nums:[['zlib, level 9','23,747 bytes','from 100,000 bytes'],['xz, extreme','20,404 bytes',''],['bzip2, level 9','17,384 bytes','best of the three on this text']],
reading:'Ordinary tools already shrink this text about four to six times. The Prize is about the last few percent beyond what the best tools reach, and about being honest on what those percent cost.',
tryit:['Run the command above and open <code>results/e01_baselines.json</code>.','Change <code>N = 100_000</code> in the file to 20,000 and to 300,000. Does the ranking of zlib, bzip2 and xz change?','Change <code>seed</code> in <code>corpus.generate</code> and see which numbers move and which stay put.'],
talk:'Open with the contract, not the code. Say: "A compressed file is only half of the bill. The program that unpacks it is the other half." Then show the three referee numbers on one slide, and the line that makes the corpus reproducible. End with: "Every claim from now on has to beat these, and pay for its own tools."',
board:'Draw a balance with two pans: <b>payload</b> on the left and <b>decompressor</b> on the right. Label the total S.',
ask:'If I could hide a whole dictionary of English inside my decompressor, would that be a clever trick or cheating? (Neither: it is simply counted in S.)',
qa:[['Why not just use the real enwik9?','It is 1 GB, so each experiment would take hours, and the repository does not bundle it. The synthetic file is small and has known structure, so we can tell <i>why</i> something works. The switch to real data is one environment variable.']]};

C[2]={t:'Surprise, entropy and honest scoring',ch:'Chapter 2',exp:'E01',cmd:'python -m experiments.e01_baselines',
files:[['hcl/coders.py','<code>ideal_bits(p)</code> and <code>entropy(p)</code> are the two basic formulas of the whole book.'],['hcl/models.py','<code>cost_bits(data, model)</code> is the scorer every experiment calls. <code>bpb()</code> turns bits into bits per byte.']],
breath:'A prediction that was right with probability p costs −log₂ p bits. Add that up over the file and you have the compressed size, even before you build a real coder.',
steps:['<b>The price of a surprise.</b> <code>ideal_bits(p)</code> is <code>-log2(p)</code>. If you gave the true byte a probability of one half, you pay 1 bit. If one in a thousand, about 10 bits.','<b>Entropy is the average price</b> when the guesser knows the true odds. <code>entropy(p)</code> sums <i>−p log p</i>. This is the floor that nobody can beat on average.','<b>The scorer checks before it learns.</b> In <code>cost_bits</code>, the model says <code>probs()</code>, the code charges <i>−log₂ p[b]</i>, and only then calls <code>update(b)</code>. A decoder can only know the past, so this ordering is the rule of the game. Swapping the two lines would be cheating, and the numbers would look wonderful and mean nothing.','<b>Bits per byte</b> (<code>bpb</code>) is just bits divided by bytes. It lets us compare a 40 KB slice with a 100 KB slice.'],
code:[['Score first, learn second','hcl/models.py','def cost_bits(data: bytes, model) -> float:\n    total = 0.0\n    for b in data:\n        p = model.probs()          # 1. the model commits to odds\n        total -= math.log2(p[b])   # 2. we charge the price of the real byte\n        model.update(b)            # 3. only now may it learn\n    return total']],
nums:[['Order-0 empirical entropy','4.8637 bits/byte','knows the true letter frequencies in advance'],['Adaptive order-0 cost','4.8715 bits/byte','learns the frequencies as it goes, so pays slightly more']],
reading:'The small gap between the two rows is the price of not knowing the answers beforehand. It is a tiny, honest example of why "score before update" matters.',
tryit:['In a scratch copy of <code>cost_bits</code>, swap lines 2 and 3 and run on a small slice. Watch the bits collapse. That is what leakage looks like.','Call <code>entropy([0.5, 0.25, 0.25])</code> and check by hand that you get 1.5.'],
talk:'Teach with a game. Ask the room to guess the next letter of a sentence and award yourself the price in bits for each wrong guess. Then show the three-line scorer: it is the whole game written in Python.',
board:'Draw a number line of probabilities from 1 down to 0 with the bit cost underneath: 1 → 0 bits, ½ → 1, ¼ → 2, ⅛ → 3, 1/1024 → 10.',
ask:'Why does a model that is sure and wrong cost so much more than one that hedges? (Because −log p grows without limit as p → 0.)',
qa:[['Is entropy the compressed size?','It is the best average size for a source whose odds are known. A real model does not know them, so it pays extra. The size is the cross-entropy: what you pay using your guess, against what actually happens.']]};

C[3]={t:'Arithmetic coding: turning odds into bits',ch:'Chapter 3',exp:'E01',cmd:'python -m unittest tests.test_core -v',
files:[['hcl/coders.py','<code>ExactArithmetic</code> (teaching version with exact fractions) and <code>RangeEncoder</code>/<code>RangeDecoder</code> (the real 32-bit integer coder).'],['tests/test_core.py','Round-trip tests: encode, decode, and check you get the original back.'],['experiments/e01_baselines.py','At the end, runs the real coder on 20 KB and compares with the ideal cost.']],
breath:'The coder cuts the interval from 0 to 1 into slices as wide as the probabilities, one symbol after another. A narrow final slice needs many bits to name; a wide one needs few.',
steps:['<b>Start with the slow, clear version.</b> <code>ExactArithmetic.encode</code> keeps a low and a high end, starting at 0 and 1. For each symbol it shrinks to that symbol\'s slice of the current interval. Fractions are exact, so nothing is lost to rounding.','<b>The shortest codeword.</b> <code>shortest_codeword(lo, hi)</code> finds the shortest binary fraction k/2<sup>m</sup> inside the final interval. That m is the code length, within two bits of the ideal.','<b>Real coders use whole numbers.</b> <code>RangeEncoder</code> keeps <code>low</code> and <code>high</code> as 32-bit integers. When both ends agree on the top bit, that bit is final and is sent out. When they straddle the middle, a counter <code>pending</code> defers the decision (the "underflow" trick) so the interval never shrinks to nothing.','<b>From a model to a file.</b> <code>encode_with_model</code> asks the model for 256 probabilities, turns them into whole-number counts with <code>quantize</code> (every symbol gets at least one count; the leftover goes to the likeliest), and encodes the byte. <code>decode_with_model</code> repeats the same model steps, so both sides always agree.','<b>The tests prove the round trip</b>: bytes in, bytes out, identical. A coder that cannot do this is worth nothing, however small its output.'],
code:[['Narrowing the interval','hcl/coders.py','for s in seq:\n    w = hi - lo                       # width of the current interval\n    a, b = self.cum[s]                # this symbol\'s slice, as fractions of 1\n    lo, hi = lo + w * a, lo + w * b   # zoom in on that slice'],['The deferred bit','hcl/coders.py','elif self.low >= QTR and self.high < HALF + QTR:\n    self.pending += 1          # underflow: deferred bit\n    self.low -= QTR\n    self.high -= QTR']],
nums:[['Ideal cost, order-3 model, 20 KB','5,690.8 bytes','just adds up −log₂ p'],['Real coder, 12-bit counts','5,463 bytes','real file, decoded back correctly'],['Real coder, 16-bit counts','5,526 bytes',''],['Real coder, 20-bit counts','5,628 bytes','']],
reading:'The real file is slightly <i>smaller</i> than the ideal sum. I checked why. The one-count minimum in <code>quantize</code> lifts the probability of rare bytes the model had given far too little mass; about 500 of the 20,000 bytes were such events, worth roughly 170 bytes, while everything else loses about 8 bytes to rounding. It is a nice case study in an honest measurement: do not assume, look.',
tryit:['Run <code>ExactArithmetic</code> on the three-symbol example in <code>tests/test_core.py</code> (<code>test_exact_abA</code>) and print the interval after each symbol.','Call <code>encode_with_model</code> with <code>total = 1 &lt;&lt; 8</code> and watch the file size rise. Why?'],
talk:'Use the cake picture. "The whole cake is 1. Every letter cuts a slice whose size is its probability. You keep the slice you land in, and go on cutting that slice." The audience will see in a minute that likely symbols leave a thick slice (cheap) and unlikely ones leave a sliver (expensive).',
board:'Draw a bar from 0 to 1. Split it for symbols a, b, c with sizes ½, ¼, ¼. Then zoom into b and split again. Show the interval shrinking.',
ask:'Which message is cheaper to code, "aaaa" or "cbca", if a has probability one half? (The first: the slices stay thick.)',
qa:[['Why not simply use Huffman coding?','Huffman must give each symbol a whole number of bits. If a symbol has probability 0.9 it ideally costs 0.15 bits but Huffman charges 1. Arithmetic coding charges the fractions. Case 4 measures what this means.']]};

C[4]={t:'Multi-symbol versus binary coding',ch:'Chapter 4',exp:'E02',cmd:'python -m experiments.e02_multisymbol',
files:[['experiments/e02_multisymbol.py','Builds one byte model three ways and counts bits and coder calls.'],['hcl/coders.py','<code>rans_encode</code> and <code>rans_decode</code>, a second way of coding with whole numbers (range ANS).']],
breath:'You can predict a byte in one step over 256 choices, or in eight yes/no steps. Same information, different cost in accuracy and in speed. The case measures both.',
steps:['<b>Three ways to split a byte.</b> The experiment predicts each byte (a) directly over 256 symbols, (b) as 8 binary decisions down a fixed tree, (c) as binary decisions down a Huffman-shaped tree, where common bytes sit near the top and need fewer decisions.','<b>The model is the same style in each.</b> <code>tree_cost</code> walks down the path of the byte. At every node it blends statistics from contexts of order 0, 1 and 2 (backoff, which you meet in Case 5), then charges <i>−log₂ p</i> for the bit that actually happened.','<b>It counts coder calls.</b> The 256-way model makes one call per byte; the fixed tree makes 8; the Huffman tree about 4.9. Each call is work for a real coder, so this is a speed proxy.','<b>rANS is an alternative coder.</b> <code>rans_encode</code> keeps one big integer <i>x</i> and pushes symbols in with <code>x = M*q + cum[s] + r</code>. It encodes in reverse so that the decoder reads forwards. It reaches nearly the same sizes as arithmetic coding by different arithmetic.'],
code:[['One byte, eight questions','experiments/e02_multisymbol.py','for ch in path:                      # path = the byte\'s binary route in the tree\n    ...\n    p1 = (n[1] + beta * p1) / (n[0] + n[1] + beta)   # blend contexts\n    bits -= math.log2(p1 if bit else 1 - p1)\n    calls += 1']],
nums:[['256-way symbol model','2.1174 bits/byte · 1 call/byte',''],['Fixed 8-level binary tree','2.0523 bits/byte · 8 calls/byte','best accuracy here, slowest'],['Huffman-shaped binary tree','2.0813 bits/byte · 4.9 calls/byte','the middle road; table cost not charged']],
reading:'On this text the binary routes are slightly more accurate, because each node shares what it learns across many bytes. They are also several times slower per byte. Nothing here is a winner for every case: it is a trade-off to be named, not hidden.',
tryit:['Change <code>order=2</code> to 1 and 3 in the call to <code>tree_cost</code>. Does the order of the three methods change?','Encode the list [0, 1, 0] with <code>rans_encode</code> using frequencies [2, 1] and decode it back.'],
talk:'Frame it as "twenty questions". A byte can be found by one big guess among 256 or by eight yes/no questions. Show the table: more questions, a little more accurate, a lot slower.',
board:'Draw a binary tree three levels deep with letters at the leaves; trace the path to one letter, then draw the Huffman version with common letters near the top.',
ask:'Which would you choose for a 50-hour time limit, and why? (The Prize has a time limit, so speed is part of the score in practice.)',
qa:[['Why is the binary tree more accurate?','Each node asks a simpler question and sees many examples, so its counts firm up quickly. The 256-way model spreads its examples across many symbols. This is a statement about this synthetic text and this small slice.']]};

C[5]={t:'Context models and backoff',ch:'Chapter 5',exp:'E01',cmd:'python -m experiments.e01_baselines',
files:[['hcl/models.py','<code>Backoff</code>: the order-<i>k</i> byte model. The workhorse of the repository.'],['hcl/ctx.py','<code>CtxExpert</code> and <code>order_keys</code>: the same idea in a form that later experiments can plug into.'],['experiments/e01_baselines.py','Runs orders 0 to 4 as a "ladder".']],
breath:'To guess the next byte, look at the last k bytes and ask what usually followed them. Where you have not seen enough, fall back to a shorter memory. This is the engine under almost everything.',
steps:['<b>Counting.</b> For each context (the last k bytes) the model keeps a count of which byte came next. <code>update(b)</code> adds one to the right counter at every order.','<b>Predicting with backoff.</b> Order 0 starts from "everything equally likely", then each higher order refines it. The key line is <code>(c + beta * prev) / (t + beta)</code>: the counts <i>c</i> out of <i>t</i> are blended with the lower-order guess <i>prev</i>, and <i>beta</i> says how much to trust the lower order. Rare contexts lean on the lower order; well-seen ones speak for themselves.','<b>Each order is also an expert.</b> <code>experts()</code> returns all the orders\' predictions. Case 6 mixes them; Case 11 studies how.','<b>The ladder.</b> E01 scores orders 0 to 4. More memory helps a lot at first, then less and less.'],
code:[['Backoff in one line','hcl/models.py','c, t = row                       # counts so far in this context\np = (c + self.beta * prev) / (t + self.beta)   # blend with the shorter context']],
nums:[['order 0','4.8715 bits/byte','letter frequencies only'],['order 1','3.2703','one byte of memory'],['order 2','2.0323','biggest single jump'],['order 3','1.6858',''],['order 4','1.5748','gains shrink; memory grows']],
reading:'Each extra byte of memory helps less, while the number of contexts to store grows quickly. That is why top compressors mix many cleverly chosen contexts instead of one very long one.',
tryit:['Change <code>beta</code> from 2.0 to 0.5 and to 8. Which orders benefit?','Plot bits per byte against order from the JSON file.'],
talk:'Hold up a sentence with the last word hidden. "The cat sat on the …": what comes next? Then hide letters instead of words. The ladder table is the same game at five levels of memory.',
board:'Write "the river fl" and draw arrows from the last 1, 2, 3 characters to what followed them before: o, ow, ows.',
ask:'Why not use order 20? (Almost every context of that length has never been seen, so there is nothing to count; backoff would fall to lower orders anyway.)',
qa:[['What is beta really doing?','Think of it as "pretend you have already seen beta samples from the shorter context". Larger beta trusts the shorter context more. It is a prior, in the Bayesian sense.']]};

C[6]={t:'Mixing experts and the noise-control habit',ch:'Chapter 6',exp:'ctx',cmd:'python -m experiments.e06_euclid   # uses the mixer in part (b)',
files:[['hcl/ctx.py','<code>Ensemble</code>: the mixer. <code>State</code>: what the decoder knows so far. <code>run_bits</code>: the scorer.'],['scoreboard.py','Computes "net of control" for every candidate idea.']],
breath:'Several predictors each give odds; a mixer learns, online, how much to trust each. And every new idea is tested three ways, so that we do not mistake extra capacity for insight.',
steps:['<b>The shared parser.</b> <code>State</code> follows everything the decoder has seen: the last bytes, the current and previous line, the stack of open <code>{{</code> and <code>[[</code>, the current word. Later experiments are all "one more context drawn from this State".','<b>Experts.</b> A <code>CtxExpert</code> turns a list of context keys (coarse to fine) into 256 probabilities, with backoff as in Case 5.','<b>The mixer.</b> <code>Ensemble.probs()</code> takes the log of each expert\'s probabilities, adds them up with weights, and re-normalises. This is a <i>geometric</i> mix, the same shape as logistic mixing in the PAQ family. <code>update()</code> nudges the weights by gradient descent so that experts that predicted the real byte well gain weight.','<b>The three arms.</b> Every experiment runs (1) <i>mixer-only</i>: the base model through the same mixer, (2) the <i>candidate</i>: base plus the new idea, (3) the <i>noise control</i>: base plus a context of equal size and shape that carries no real information (for example column mod 7). The idea earns credit only for the gain <i>beyond</i> the control.','<b>Why the control matters.</b> Adding any extra expert can help a little just by giving the mixer more freedom. The control measures that "free lunch" so we can subtract it.'],
code:[['Weights learn from surprise','hcl/ctx.py','s = self.w @ self.L                # weighted sum of log-probabilities\nz = np.exp(s - s.max()); p = z / z.sum()   # back to probabilities\n...\ng = -self.L[:, b] + self.L @ self.p   # how much each expert should gain or lose\nself.w -= self.lr * np.clip(g, -5, 5)']],
nums:[['Example: lattice context (Case 10)','mixer-only 1.9859 · candidate 1.9526 · control 1.9709','raw gain −1.7%; control −0.8%; net −0.9%']],
reading:'The raw gain (−1.7%) is not the real gain. About half of it is what a meaningless context also earns. Only the net (−0.9%) is credited to the idea. This habit is the single most transferable lesson of the book.',
tryit:['Open <code>results/SCOREBOARD.md</code> and read one row from left to right.','In <code>e06_euclid.py</code> change the noise control from <code>% 7</code> to <code>% 3</code>. Does the net gain change?'],
talk:'Tell it as a drug trial. "New pill versus sugar pill." The sugar pill here is the noise control. Show one row of the scoreboard and ask the audience which number the paper should print.',
board:'Three columns: base, candidate, control. Draw arrows for the two differences and shade the net.',
ask:'If the control gains more than the candidate, what does that tell you? (That the idea is worse than adding a random feature, and the apparent gain was extra capacity.)',
qa:[['Could the control itself be unlucky and accidentally informative?','Yes. That is why the controls are chosen to be unrelated to the text (counters modulo a small prime) and why the book calls a single run weak evidence. A stronger design would use several controls and several data slices.']]};

C[7]={t:'Copy-with-edits as a shortest-path problem',ch:'Chapter 7',exp:'E03',cmd:'python -m experiments.e03_copy_edits',
files:[['experiments/e03_copy_edits.py','Finds, for every position, the ways to copy from earlier text, then picks the cheapest plan by dynamic programming.'],['tests/test_experiments.py','Checks that the clever plan is never worse than the greedy one.']],
breath:'A repeated passage can be sent as "copy from d bytes back, for L bytes". If the copy is nearly right, it may be cheaper to copy and fix a byte or two. Choosing well is a shortest-path problem.',
steps:['<b>Prices.</b> A fixed price list stands in for a real coder: a literal costs its surprise; a copy costs a tag plus an Elias-delta code for the distance plus an Elias-gamma code for the length; a fix costs the gap plus the replacement byte. Because the same prices are used for every variant, comparisons are fair. Be clear it is a <i>surrogate</i>, not a real file.','<b>Finding candidates.</b> <code>build()</code> indexes every 5-byte phrase. At each position it looks at up to 24 earlier places where the same 5 bytes occurred and measures how far the match runs. Each is an <i>edge</i> of a graph: from position i to position i+L at some cost.','<b>Edits.</b> With edits allowed, after an exact run it tries a substitution of one byte, then continues if matching resumes, up to 3 substitutions. Each of these becomes an extra edge.','<b>Greedy versus best.</b> The greedy plan always takes the longest exact copy. <code>solve()</code> instead walks backwards from the end: <code>cost[i]</code> is the cheapest way to finish from i. This is dynamic programming on a graph, and it is guaranteed optimal for these prices.','<b>The control.</b> The same pipeline is run on a corpus with no near-duplicate revisions. If edits still "helped" there, the gain would be an artefact.'],
code:[['The shortest-path step','experiments/e03_copy_edits.py','for i in range(n - 1, -1, -1):          # from the end backwards\n    best = 1 + lit[i] + cost[i + 1]       # option 1: send a literal\n    for L, b, e, sp in edges[i]:          # option 2: any copy or edit edge\n        if i + L <= n and b + cost[i + L] < best:\n            best = b + cost[i + L]\n    cost[i] = best']],
nums:[['Greedy longest exact copy','18,021 bytes','surrogate cost model'],['Optimal exact copies (DP)','16,564 bytes','−1,457 vs greedy'],['Optimal with up to 3 edits','16,282 bytes','−282 more; 214 edit steps, 452 substituted bytes']],
reading:'Planning ahead beats the greedy habit by about 8%; allowing edits adds about 1.7%. The edits are worth most where revisions exist. The numbers are in <i>surrogate bits</i>, so they show the mechanism, not a finished archive.',
tryit:['Change <code>K = 3</code> to 1 and to 6. Where do the gains stop?','Change <code>MIN = 6</code> to 4. Does the plan make more or fewer copies?'],
talk:'Use a satnav. "The greedy driver always takes the longest road in front of them. The satnav looks at the whole map." Show the two totals. Then show the small change that adds edits.',
board:'Draw positions as dots on a line with arcs for copies of different lengths; mark the cheapest path in colour.',
ask:'Why must the DP run backwards? (Because the cheapest way from position i needs the cheapest ways from the positions after i, which are already known.)',
qa:[['Is this a real compressor?','Not yet. The prices are static stand-ins; a real one would adapt them as it learns. It shows how much the planning and the edits are worth under a fixed, fair price list.']]};

C[8]={t:'Recursive grammars and description length',ch:'Chapter 8',exp:'E04',cmd:'python -m experiments.e04_grammar',
files:[['experiments/e04_grammar.py','Re-Pair: repeatedly replace the most common adjacent pair by a new symbol, then count the total description.']],
breath:'Find the most common pair of symbols, give it a new name, and rewrite the text. Repeat. A grammar that names repeated phrases can describe the text shortly — but the grammar itself is not free.',
steps:['<b>Re-Pair loop.</b> <code>repair()</code> counts adjacent pairs, picks the most frequent, replaces every occurrence by a new symbol numbered 256, 257, … and records the rule. Later rules can use earlier rule symbols, which is the "recursive" part.','<b>Two-part description.</b> <code>dl_bits()</code> adds the cost of the rewritten text (its order-0 entropy times its length) to the cost of the rules (2·log₂(256+R) bits each). Making the grammar bigger shortens the text but lengthens the rule book.','<b>The U-curve.</b> The code records the total at 0, 100, 200 … 2,500 rules. It falls, bottoms out, and rises again, because late rules save little and cost much.','<b>Decoding is easy.</b> <code>expand()</code> uses a stack to unfold a symbol back into bytes, to prove that the grammar is lossless.'],
code:[['Name the most common pair','experiments/e04_grammar.py','pairs = Counter(zip(seq, seq[1:]))\n(a, b), cnt = pairs.most_common(1)[0]\n...\nrules.append((a, b)); seq = out; nxt += 1   # a new symbol stands for "a then b"']],
nums:[['No rules (order-0 only)','36,549 bytes',''],['100 rules','25,037',''],['400 rules','16,007',''],['best: 975 rules','13,591','852 of them use other rules'],['2,500 rules','14,866','past the bottom of the U']],
reading:'More rules help up to about 1,000 and hurt afterwards. This is the principle of minimum description length in action: the best model is the one that makes the <i>whole</i> description shortest, rule book included.',
tryit:['Change the cost per rule from <code>2 * R * log2(256 + R)</code> to <code>R * log2(256 + R)</code> (a cheaper rule book). Where does the minimum move?','Run on the "repeated phrase" fixture and compare the minimum with the one for the corpus.'],
talk:'Use abbreviations. "Never type \'The Hutter Prize\' in full again: call it HP." Show how names pay for themselves only when used often, then show the U-curve.',
board:'Write "abab abab abab" and apply two rules by hand, drawing the shrinking string and the growing rule list.',
ask:'Who pays for the rule book in the real Prize? (The decompressor, so rules count in S.)',
qa:[['Is a grammar better than an order-3 model?','Not directly comparable here: this table uses a simple order-0 code for the rewritten text, to isolate the effect of the rules. Combining rules with a good model is the next step, and one of the untested ideas.']]};

C[9]={t:'Energy models and the Born rule',ch:'Chapter 9',exp:'E05',cmd:'python -m experiments.e05_energy',
files:[['experiments/e05_energy.py','<code>LogLinear</code>: a learned score for each (context, byte) pair, turned into probabilities, with a "Born" variant.']],
breath:'Instead of counting, give each possible next byte an "energy" and let low energy mean high probability, as in physics. The model learns its energies by gradient steps. A second version squares amplitudes, as in quantum mechanics.',
steps:['<b>Hashed weights.</b> For each order (0 to 2, or 0 to 3) the last bytes are hashed to a row of 256 weights. The score of a byte is the sum of the weights across orders.','<b>Boltzmann probabilities.</b> <code>p = exp(score) / sum</code>. This is the same softmax used in neural networks and in statistical physics.','<b>Learning.</b> <code>update()</code> computes the gradient of the surprise and takes an AdaGrad step. AdaGrad gives rarely-used rows bigger steps, which suits sparse contexts.','<b>The Born variant.</b> With <code>born=True</code> the score is an <i>amplitude</i> and <code>p = a² / sum(a²)</code>. Squaring makes every probability non-negative automatically, but there is no reason to expect it to learn better.','<b>Fair comparison.</b> The count-based backoff model is the reference, and a learning-rate sweep is reported for each variant.'],
code:[['Two ways to make probabilities','experiments/e05_energy.py','if self.born:\n    self.a = s + 1e-3\n    p = self.a ** 2; p /= p.sum()          # Born: square the amplitudes\nelse:\n    z = np.exp(s - s.max()); p = z / z.sum()   # Boltzmann: exponentiate the score']],
nums:[['Counting, order 3 (reference)','1.9378 bits/byte',''],['Boltzmann, orders 0–2','2.2624','best learning rate'],['Boltzmann, orders 0–3','2.0897','still behind counting'],['Born amplitudes, orders 0–2','2.3040','worse than Boltzmann']],
reading:'On 40 KB the learned energy models do not beat plain counting, and the Born variant is worse still. Counting is a very strong, hard-to-beat learner on small data. This is an honest negative result, and it tells you where learned models would need more data or more clever updates.',
tryit:['Add <code>0.6</code> to the first learning-rate list (Boltzmann, orders 0–2) and see whether a better rate exists.','Raise <code>N</code> to 150,000: does the gap to counting shrink?'],
talk:'Say what energy means: "A ball rolls to the lowest valley; the lowest-energy byte is the most probable one." Then say, with a straight face, that physics-flavoured does not mean better, and show the table.',
board:'Draw a bumpy landscape with three valleys labelled a, b, c; the depth of each valley is its energy; write p ∝ exp(−energy) beside it.',
ask:'Why might counting win on 40 KB? (A count is the exact answer to "what happened here before?" and needs no tuning.)',
qa:[['Is the Born variant "quantum computing"?','No. It only borrows the squaring rule. Nothing here runs on a quantum computer or gains a quantum speed-up. The case asks only whether squaring amplitudes is a useful way to parameterise probabilities.']]};
C[10]={t:'Euclidean translations: repeats and lattices',ch:'Chapter 10',exp:'E06',cmd:'python -m experiments.e06_euclid',
files:[['experiments/e06_euclid.py','Part (a): do copy distances repeat? Part (b): is text a 2-D grid where "the byte above" helps?']],
breath:'A copy is a shift of the text by some distance. Two questions follow. Do the same shifts come back, so a small cache of recent distances would save bits? And if you lay the text out in lines, does the byte directly above predict the byte here?',
steps:['<b>Part (a): the repeat-offset cache.</b> <code>offsets_greedy()</code> lists the copy distances a greedy plan would use. Then two price lists are compared: plain (each distance coded in full) and with a 4-entry move-to-front cache (a hit costs 3 bits; a miss costs a flag plus the full code).','<b>Reading the result.</b> If distances rarely repeat, the cache costs more in flags than it saves in hits. It is break-even only when the hit rate is high enough.','<b>Part (b): the lattice.</b> <code>State.above()</code> returns the byte one row up at the same column; <code>left()</code> the previous bytes. An expert keyed on (above, left) is added to the mixer.','<b>The three arms again.</b> The control uses "column mod 7", which has the same size and shape but knows nothing about the text. The net gain is the candidate minus the control.'],
code:[['The geometric idea as a context','experiments/e06_euclid.py','above = lambda: CtxExpert("above_left",\n    lambda st: [b"", bytes([st.above()]),\n                bytes([st.above(), st.left()]),\n                bytes([st.above(), st.left(), st.left(2)])])']],
nums:[['(a) cache hit rate','2.09%','of 6,894 copies'],['(a) plain vs cache','151,349 vs 155,442 bits','the cache loses 512 bytes'],['(b) mixer-only','1.9859 bits/byte',''],['(b) with above/left','1.9526','−1.7%'],['(b) noise control','1.9709','−0.8%; net −0.9%']],
reading:'Translations of the copy distance almost never repeat in this corpus, so the cache fails. The lattice context helps a little, but about half of the gain is what a meaningless context also earns. Elegant geometry has to meet a skeptical control.',
tryit:['Change the cache size from 4 to 16 in <code>part_a()</code>. Does the hit rate climb enough?','Add <code>st.above(1)</code> (the byte up and to the right) to the lattice context.'],
talk:'Pick a table with aligned columns on a slide. "Here the byte above really is informative." Then show that Wikipedia prose is not a table, and the gain is small. The lesson: a structural idea pays in proportion to how much of the data has that structure.',
board:'Draw text as a grid of boxes, shade a box, and draw arrows from its left neighbours and from the box above.',
ask:'On which kind of file would the lattice context win big? (Fixed-width tables, which is Case 14.)',
qa:[['Is a copy really a "translation"?','Yes in the mathematical sense: you slide the sequence along itself by d and ask where the two agree. That view makes it natural to ask whether the same slide recurs.']]};

C[11]={t:'Information geometry of mixing',ch:'Chapter 11',exp:'E07',cmd:'python -m experiments.e07_infogeom',
files:[['experiments/e07_infogeom.py','<code>verify_projection_facts</code> checks two theorems numerically; <code>Mixer</code> compares linear, geometric and natural-gradient mixing.']],
breath:'A prediction is a point in a space of probabilities. Mixing two predictions can follow a straight line in two different senses, and each one is "best" for a different notion of distance. The case checks this numerically and then tests it as a mixer.',
steps:['<b>Two kinds of average.</b> The linear mix is <code>sum w·p</code>. The geometric mix is <code>prod p^w</code>, re-normalised.','<b>Two facts, checked on 200 random cases.</b> <code>verify_projection_facts</code> draws random distributions and tests that the linear mix minimises the total forward divergence Σ KL(pᵢ‖q), and the geometric mix minimises the total reverse divergence Σ KL(q‖pᵢ). Both held in 200 of 200 trials. These are centroid statements.','<b>The mixers.</b> <code>Mixer</code> mixes order 0 to 3 in three ways: Bayesian linear mixing (weights by likelihood), geometric mixing with plain gradient descent, and geometric mixing with a <i>natural</i> gradient (the step is corrected by the Fisher information matrix <code>F</code>).','<b>The natural gradient.</b> The natural gradient takes the steepest step as measured by the geometry of the probabilities instead of by raw coordinates. In theory a better direction; in practice it needs a good step size and many samples.'],
code:[['The two means','experiments/e07_infogeom.py','lin = P.mean(0)                                  # linear (m) mean\ngeo = np.exp(np.log(P).mean(0)); geo /= geo.sum()  # geometric (e) mean\nf_m = lambda q: sum(kl(p, q) for p in P)           # forward KL\nf_e = lambda q: sum(kl(q, p) for p in P)           # reverse KL']],
nums:[['Linear = forward-KL centroid','200 / 200 trials',''],['Geometric = reverse-KL centroid','200 / 200 trials',''],['Best single order-3','2.0627 bits/byte',''],['Linear (Bayes) mixer','2.0628','puts all weight on order 3: no gain'],['Geometric, plain gradient','1.9834','best'],['Geometric, natural gradient','2.0173','worse here']],
reading:'The geometry is exact; the experiment is humbling. Geometric mixing beats linear by about 3.8% here, yet the natural gradient does not beat the plain one on a stream this short. The book says plainly that it does not explain why geometric wins in practice.',
tryit:['Change <code>trials</code> to 2,000 and rerun the projection check.','Sweep the natural-gradient learning rate in a finer grid between 1e-5 and 3e-4.'],
talk:'Use a map. "The straight line between two cities on a flat map is not the straight line on the globe." Linear and geometric mixing are two different kinds of straight line on the space of predictions.',
board:'Draw a triangle (the space of probabilities over three outcomes). Place p and q. Draw the straight chord and a curved path and label them linear and geometric.',
ask:'Why is it enough to check 200 random cases and not a proof? (It is a sanity check on the code; the theorems are known results.)',
qa:[['Which is "right", linear or geometric?','Neither in general. Each is optimal for its own divergence. Geometric mixing sharpens agreement (when experts agree, the mix is more confident than any), which often suits compression. Why this wins so consistently is not established in the book.']]};

C[12]={t:'Topology: nesting, cycles and clusters',ch:'Chapter 12',exp:'E08',cmd:'python -m experiments.e08_topology',
files:[['experiments/e08_topology.py','Part (a): a stack context for bracket nesting. Part (b): link-graph topology (Betti numbers, clusters).'],['hcl/ctx.py','<code>State.update</code> keeps the stack of open <code>{{</code> and <code>[[</code>.']],
breath:'Markup like {{…}} and [[…]] nests without crossing, and a stack follows that for free. Link graphs have loops and clusters that topology can count. The case asks which of these structures an honest control confirms.',
steps:['<b>The stack.</b> Each time the parser sees a doubled opener it pushes onto <code>st.stack</code>; a matching closer pops. The pairs never cross, so the count of valid pairings is a Catalan number and the structure carries about 2 bits per pair.','<b>A stack context.</b> The expert\'s context is (top of stack, depth, last bytes). It is added to the order-3 base through the mixer, against a noise control of equal size.','<b>Where did the gain come from?</b> The code splits the cost into bits spent on closing delimiters and bits spent on everything else, to test the claim that the stack helps because it predicts closers.','<b>Link-graph topology (part b).</b> Each article is a set of links. The graph of links that appear together has vertices V and edges E; its cycle count is b₁ = E − V + b₀ (Betti number). Union-find computes connected components at thresholds, a first step toward persistent homology (H₀).','<b>A positive control.</b> A synthetic graph with planted communities checks the method can find structure when it exists. The corpus links themselves show none that helps coding.'],
code:[['The stack that follows the nesting','hcl/ctx.py','if b in OPEN and last == b and not self.last_consumed:\n    self.stack.append(OPEN[b]); self.last_consumed = True   # "{{" or "[[" opens\nelif b in CLOSE and last == b and not self.last_consumed:\n    if self.stack and self.stack[-1] == CLOSE[b]:\n        self.stack.pop()                                   # the matching closer pops']],
nums:[['(a) mixer-only','1.8758 bits/byte',''],['(a) plus stack','1.8064','−3.7%'],['(a) noise control','1.8507','−1.3%; net −2.4%'],['(a) closing delimiters','1,957 → 1,418 bits','the stack saves 27% there'],['(b) cycle rank b₁ (corpus links)','5,302','V=120, E=5,421, b₀=1'],['(b) coding gain from cluster context','none on the corpus','planted control: 6.826 vs 6.954 bits/link']],
reading:'Nesting is real structure, and the stack earns a net 2.4% on this slice. But Wikipedia\'s nesting here is shallow (maximum depth 1), so do not expect big wins without deeper templates. In the link graph the clusters only appear at high thresholds, and a cluster context gave no coding gain on the corpus links (6.976 bits per link, the same as order 0): topology confirmed that there was no cluster to exploit.',
tryit:['Print the maximum stack depth on a real enwik slice (set <code>HCL_ENWIK</code>).','Change the planted-community probability <code>p_in</code> in <code>structured_links</code> and watch the positive control weaken.'],
talk:'Show a long nested template as brackets and ask the audience to match them. They use a mental stack. Then show that the program uses one, and report the measured net gain without inflating it.',
board:'Draw nested brackets as arcs above a line; then a graph with a loop and write b₁ = E − V + b₀ beside it.',
ask:'If a stack helps only with closing brackets, what fraction of all bytes can it improve? (Here 707 of the slice, so a small share — which is why the total gain is modest.)',
qa:[['What is "persistent homology" here?','You grow a threshold, link ever more of the graph, and record when clusters appear and merge. Features that survive across many thresholds are real; short-lived ones are noise. The code does the simplest part, tracking components.']]};

C[13]={t:'Quantum topology: knot sums, amplitudes and stacks',ch:'Chapter 13',exp:'E09',cmd:'python -m experiments.e09_quantum_topology',
files:[['experiments/e09_quantum_topology.py','(a) the Kauffman bracket by state sum; (b) the golden-ratio loop weight and Born rule; (c) a planar source with a stack-aware model.']],
breath:'A knot invariant is computed by summing over 2<sup>c</sup> ways of smoothing the crossings, with complex weights. The same non-crossing structure appears in a source built from cancelling pairs. The case keeps the maths and the compression results strictly apart.',
steps:['<b>State sum.</b> <code>bracket()</code> loops over all 2<sup>c</sup> choices of smoothing. For each state it counts the loops with union-find and adds the term A<sup>a−b</sup>·d<sup>loops−1</sup>, where d = −A² − A⁻².','<b>Check against textbooks.</b> The trefoil (8 states) gives A⁻⁷ − A⁻³ − A⁵ and the figure-eight (16 states) gives A⁻⁸ − A⁻⁴ + 1 − A⁴ + A⁸. Tests confirm both.','<b>The golden ratio.</b> At A = e<sup>2πi/5</sup> the loop weight d equals 1.618…, the golden ratio. The code evaluates the trefoil there and shows the result is a complex number, an <i>amplitude</i>. Only its squared size is a probability weight (here 2.382).','<b>A planar source.</b> <code>gen_word</code> writes words in a free group: a symbol can be a new letter or the cancelling inverse of the pending one. The "action" entropy is known exactly.','<b>Generic versus stack-aware.</b> Order-<i>k</i> context models are compared with <code>StackModel</code>, which keeps the stack of pending inverses.'],
code:[['Sum over states','experiments/e09_quantum_topology.py','for s in range(1 << c):                 # every way to smooth the crossings\n    ...\n    loops = len({f(x) for x in labels})  # count closed loops in this state\n    term = ppow(d, loops - 1)            # d^(loops-1)\n    total = padd(total, term)            # add A^(a-b) * d^(loops-1)']],
nums:[['Trefoil, states summed','8 → A⁻⁷ − A⁻³ − A⁵','matches textbook'],['Figure-eight','16 states','matches textbook'],['Loop weight at A = e^(2πi/5)','1.618034','golden ratio'],['Action-level entropy of the source','1.7182 bits/symbol','an upper bound'],['Best generic context model (order 2)','1.767',''],['Stack-aware model','1.5654','beats the "entropy" because it is an upper bound']],
reading:'The mathematics is checked exactly. For compression, a model that tracks the right structure (the stack) beats generic contexts on a source built to have that structure. Nothing here shows that knot theory helps compress text, and the book says so. One correction made along the way: the 1.7182 figure is an upper bound on the symbol entropy, not the entropy itself, so a symbol-level model may beat it, and does.',
tryit:['Add a three-crossing "mirror" trefoil and check its bracket differs by A → A⁻¹.','Change <code>p_push</code> in <code>gen_word</code> from 0.35 to 0.5 and see how the gap between generic and stack-aware changes.'],
talk:'Keep the quantum part short and visual: "Sum over all ways, with complex weights; squares give odds." Then say clearly: "Interesting mathematics, no compression claim." The stack result is the honest take-away.',
board:'Draw a crossing and its two smoothings. Write the weights A and A⁻¹ above each and the loop weight d for a closed circle.',
ask:'Which is a probability: the bracket value or its squared size? (The squared size, after normalising; the bracket itself is a complex amplitude.)',
qa:[['Does this connect to quantum computers?','Evaluating the Jones polynomial at special points is a known task for quantum computers. The repository does not use or claim that. It runs on an ordinary laptop and treats the maths as a source of structure to test.']]};

C[14]={t:'Harmonic analysis and generators: Langlands-flavoured',ch:'Chapter 14',exp:'E10',cmd:'python -m experiments.e10_harmonic',
files:[['experiments/e10_harmonic.py','(a) detect a repeating record width and use it as a context; (b) generate a number table from a short rule and charge for the rule.']],
breath:'If data repeats every P positions, a "wave" of period P is hiding in it. Find P, then use position-in-the-record as context. And if a whole table comes from a short rule, ship the rule once. The Prize\'s accounting makes the break-even explicit.',
steps:['<b>Spot the period.</b> <code>equality_autocorr</code> measures, for each lag, how often a byte equals the byte lag positions later. A strong peak marks a period. On the fixed-width fixture the peak is at 28, which is the true width.','<b>Smallest peak near the top.</b> The lag 2P also scores high, because a stream that repeats every P also repeats every 2P; the code picks the smallest lag near the maximum.','<b>Use it.</b> A context keyed on (position mod P, the byte P back, previous byte) joins the base model through the mixer, against a noise control.','<b>The corpus is not fixed-width.</b> On the River Archive the best lag scores only 0.092, which is the background level; no period is claimed.','<b>Generator-aware coding.</b> <code>tau_table</code> computes Ramanujan\'s τ(n) by multiplying out the product (1 − qⁿ)²⁴. The code also checks 202 instances of the Hecke relations (no violations).','<b>The accounting.</b> A 400-entry table costs 5,397 bytes raw and 2,648 with xz; the generator that makes it is 115 bytes. The net saving is model cost minus generator minus glue.'],
code:[['Where the wave is','experiments/e10_harmonic.py','a = np.frombuffer(d, dtype=np.uint8)\nreturn {k: float((a[:-k] == a[k:]).mean()) for k in range(2, maxlag)}'],['A table from a rule','experiments/e10_harmonic.py','c = [1] + [0] * N\nfor n in range(1, N + 1):\n    for _ in range(24):\n        for i in range(N, n - 1, -1):\n            c[i] -= c[i - n]     # multiplies in (1 - q^n), 24 times']],
nums:[['Detected period','28 (true: 28)','peak 0.587; at 2P 0.576'],['Fixed-width: mixer-only','2.0752 bits/byte',''],['Fixed-width: plus period','1.0792','−48.0%'],['Fixed-width: noise control','1.6218','−21.8%; net −26.1%'],['Table of 400 values τ(n)','5,397 B · xz 2,648 B · generator 115 B',''],['The primes page','1.01% of corpus cost','so little to gain']],
reading:'On data that really is a fixed-width table, the period character is a large net win. On the Wikipedia-like corpus there is no such period. And the generator idea works only for exact, rule-made tables, which are a tiny part of the cost. It is a lesson in matching the method to the data.',
tryit:['Change the noise percent in the Case 14 tool of the companion app and watch the detected period.','Replace the Ramanujan rule with squares or Fibonacci numbers and compare the generator size with the table.'],
talk:'Play a repeating drum pattern. Ask the audience to find the loop length. That is autocorrelation. Then show the table of numbers and the 115-byte program that makes it; the contrast is memorable.',
board:'Draw a sine wave with period P, and under it the same pattern with "agreement score" peaks at P, 2P, 3P.',
ask:'Why does counting the decoder matter for the generator idea? (Because the 115 bytes of rule are part of S; without that the "saving" would be fictitious.)',
qa:[['What is "Langlands" doing here?','Only an idea: one object with two descriptions, one very long (a table) and one very short (a formula). The code uses no Langlands theorem. It borrows the habit of looking for the short description, and checks it with the Hecke relations.']]};

C[15]={t:'Lenses and functors: reversible preprocessing',ch:'Chapter 15',exp:'E11',cmd:'python -m experiments.e11_lens_functor',
files:[['hcl/lenses.py','<code>Lens</code>, <code>Compose</code>, <code>CaseLens</code>, <code>WordDictLens</code> and <code>check_laws</code>.'],['experiments/e11_lens_functor.py','(a) the lens pipeline on a compressor; (b) subadditivity and normalised compression distance.']],
breath:'A lens splits data into a simple "view" plus a "complement" with everything that was removed, so the original can be rebuilt exactly. Preprocessing is safe only if you pay for the complement. This case tests whether it is worth it.',
steps:['<b>The two laws.</b> <code>put(get(s)) == s</code>: nothing is lost. <code>get(put(v, c)) == (v, c)</code>: the split is canonical. <code>check_laws</code> tests both on 201 samples for each lens and for the composition: all pass.','<b>CaseLens.</b> The view is lowercased text; the complement is the list of gaps between capital letters. Lowercasing <i>without</i> the complement is lossy, and a test proves it.','<b>WordDictLens.</b> The 100 most useful frequent words become single bytes ≥ 128; the complement is the dictionary.','<b>Compose.</b> Lenses chain: the complement of the pipeline is the tuple of each step\'s complement. This is the "functor" in the book: composition preserves the laws.','<b>Accounting.</b> Total cost = cost(view) + cost(complement) [+ dictionary]. The complement is compressed separately with xz.','<b>Subadditivity.</b> E11(b) measures C(x) + C(y) − C(xy), the "defect", and the normalised compression distance, as a measure of shared structure.'],
code:[['A lens in six lines','hcl/lenses.py','class CaseLens(Lens):\n    def get(self, s):      # view = lowercase text; complement = gaps between capitals\n        ...\n        return s.lower(), tuple(gaps)\n    def put(self, v, c):   # rebuild: lift the letters at the recorded positions\n        ...']],
nums:[['xz on raw text (60 KB)','12,928 bytes',''],['xz on pipeline view + complements','11,112 + 1,292 + 584 = 12,988','60 bytes worse'],['order-3 model on raw','13,531',''],['order-3 on view, complements by xz','12,602 + 1,876 = 14,478','947 worse'],['NCD: article vs its revision','0.060','near-duplicates'],['NCD: independent random strings','0.988','unrelated']],
reading:'The pipeline <i>loses</i>. The view is cheaper but the complement eats the saving, and coding it separately throws away the dependence between capitals and words. The lens structure is excellent for correctness and testing; as a compression trick it needs a smarter complement code.',
tryit:['Code the capital-letter flag inside the order-3 model instead of as a separate list; does the loss shrink?','Run <code>check_laws</code> on your own lens, e.g. one that normalises line endings.'],
talk:'Use a suitcase. "I can fold my clothes (the view) only if I also keep the list of how to unfold them (the complement). If the list is as big as the space I saved, there is no gain." Then show the two totals.',
board:'Draw an arrow from S to the pair (V, C) and a return arrow. Write the two laws on the arrows.',
ask:'When would a lens pay? (When the complement is far cheaper than the view\'s saving, e.g. when capitals are very rare and predictable.)',
qa:[['What does "functor" mean here?','Only that chaining pipelines is well-behaved: if each step obeys the laws, so does the whole chain. The code does not claim that compression cost is a functor; it measures how close to additive it is.']]};

C[16]={t:'Theoretical physics: temperature, scales and limits',ch:'Chapter 16',exp:'E12',cmd:'python -m experiments.e12_physics',
files:[['experiments/e12_physics.py','Five parts: temperature scaling, multi-scale contexts, Zipf, Landauer, and an entropy-rate estimator.']],
breath:'Physics offers practical tools. Temperature calibrates how confident a model is. Coarse-graining adds contexts at different scales. Zipf\'s law describes the vocabulary. Landauer\'s bound shows how far the contest is from physical limits.',
steps:['<b>Temperature.</b> <code>p^(1/T)</code>, re-normalised. T above 1 flattens a model that is too sure of itself. T is fitted on the first half of the data and scored on the second half, which keeps the evaluation honest.','<b>Renormalisation.</b> Contexts at three scales join the base: word-level (previous words), character-class blocks (letter/digit/space patterns), and both. A noise control of the same size is the reference.','<b>Zipf.</b> The generator plants exponent 1, and the fit recovers 0.936. This is a sanity check on the pipeline, not a discovery.','<b>Landauer.</b> The least heat for erasing a bit is kT ln 2, about 2.87×10⁻²¹ J at 300 K. For the 8×10⁹ bits of enwik9 this is about 2.3×10⁻¹¹ J, vastly below an assumed 100 W machine over 50 hours.','<b>Entropy rate.</b> The Ornstein–Weiss recurrence estimator is validated on a known 2-bit source (it returns 1.858, a visible bias) and then used with care as an order-of-magnitude check.'],
code:[['Temperature in three lines','experiments/e12_physics.py','lp = np.log(P[lo:hi]) / T                      # divide log-probabilities by T\nlz = np.log(np.exp(lp - lp.max(1, keepdims=True)).sum(1)) + lp.max(1)\n... -(lp[np.arange(hi - lo), y[lo:hi]] - lz).sum()   # re-normalise and score']],
nums:[['Temperature: T = 1 → tuned (T = 1.4)','1.7288 → 1.7114 bits/byte',''],['Scales: mixer-only','1.9859',''],['word scale / class-block / both','1.7139 / 1.8467 / 1.6448','net of control: −13.4 / −6.8 / −16.9%'],['noise control','1.9809','−0.3%'],['Zipf exponent','0.936 (planted 1)',''],['Landauer floor vs machine','2.3×10⁻¹¹ J vs 1.8×10⁷ J','a factor of about 8×10¹⁷']],
reading:'Multi-scale contexts are the biggest net win in the whole table on this corpus, but the corpus was generated with word structure, so real text will differ. Temperature is a free, tiny gain. The physical bound is irrelevant to the contest: engineering, not thermodynamics, is the limit.',
tryit:['Make the temperature grid finer around 1.4.','Add a third scale, such as sentence-level context, and use a matching control.'],
talk:'Open with the Landauer number: "Physics lets us do this with a hundred-billionth of a joule; our laptop uses a hundred million joules. So we are nowhere near the physical limit." It frees the audience to focus on algorithms.',
board:'Draw three nested boxes: characters, words, sentences. Arrows from each into a mixer.',
ask:'Why tune T on one half and score on the other? (To avoid fitting the answer: otherwise the result is optimistic.)',
qa:[['Is the multi-scale result trustworthy for Wikipedia?','It is a promising mechanism, not a prediction. The generator has words and sentences by design. The right next step is to rerun on real enwik slices with the same controls.']]};

function copyBtn(text,label){return `<button class="act alt" data-copy="${esc(text).replace(/"/g,'&quot;')}">${label||'Copy'}<\/button>`}
function wireCopy(root){root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const t=b.getAttribute('data-copy');const ok=()=>{const o=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=o,1200)};try{navigator.clipboard.writeText(t).then(ok,()=>{b.textContent='Select and copy by hand'})}catch(e){b.textContent='Select and copy by hand'}})}
function link(path){return `<a href="${GH+path}">${path}<\/a>`}

function pageStart(){return `<h2>Start here<\/h2>
<div class="breath">The repository is a small laboratory. Twelve short experiments each take one idea for compressing text, run it against an honest baseline and against a control that has the same size but knows nothing, and report only the difference. This guide walks you through it, case by case, so that you can follow it yourself and then teach it.<\/div>
<h3>The three ideas that run through all the code<\/h3>
<div class="grid"><div class="card"><b>1. Compression is prediction<\/b><p>If a model can say how likely each next byte is, a coder turns those odds into bits. Better odds, fewer bits. Cases 2 to 6.<\/p><\/div><div class="card"><b>2. Always pay for the tools<\/b><p>The Hutter Prize counts the decompressor as well as the compressed file. Every shortcut that hides cost is refused. Cases 1, 8, 14, 15.<\/p><\/div><div class="card"><b>3. Subtract the control<\/b><p>A new idea earns credit only for the gain beyond a capacity-matched noise control. Case 6 and the scoreboard in Case 18.<\/p><\/div><\/div>
<h3>What is in the repository<\/h3>
<table><tr><th>Folder or file<\/th><th>What it is for<\/th><\/tr>
<tr><td><code>hcl/<\/code><\/td><td>The shared toolkit: <code>corpus.py<\/code> (the test text), <code>coders.py<\/code> (arithmetic and rANS coding), <code>models.py<\/code> (counting models and the scorer), <code>ctx.py<\/code> (parser state, context experts, the mixer), <code>lenses.py<\/code> (reversible preprocessing).<\/td><\/tr>
<tr><td><code>experiments/<\/code><\/td><td>Twelve experiments, <code>e01<\/code> to <code>e12<\/code>. Each has a <code>run()<\/code> that returns a dictionary of results. <code>common.py<\/code> holds the shared helpers.<\/td><\/tr>
<tr><td><code>run_all.py<\/code>, <code>scoreboard.py<\/code><\/td><td>Run everything (about a minute) and build the net-of-control table.<\/td><\/tr>
<tr><td><code>results/<\/code><\/td><td>The saved numbers: one JSON file per experiment, <code>all_results.json<\/code>, and <code>SCOREBOARD.md<\/code>.<\/td><\/tr>
<tr><td><code>tests/<\/code><\/td><td>Eighteen tests that guard the claims: coder round trips, lens laws, knot polynomials, and so on.<\/td><\/tr>
<tr><td><code>docs/<\/code>, <code>books/<\/code>, <code>interactive/<\/code><\/td><td>The approach atlas, the two PDFs, and the offline study apps.<\/td><\/tr><\/table>
<h3>How to read any case in this guide<\/h3>
<ol class="steps"><li><b>Read the "one breath" box.<\/b> If you can say it aloud in one breath, you have the idea.<\/li><li><b>Open the file named under "Where the code lives".<\/b> Each case has one to three files. Most are under 100 lines.<\/li><li><b>Follow the numbered steps<\/b> with the code beside you. The excerpts are the real lines from the repository.<\/li><li><b>Run the command.<\/b> It prints a dictionary of numbers. They match the table on the page, because every run is deterministic.<\/li><li><b>Change one number<\/b> from "Try it yourself", rerun, and see what moves.<\/li><li><b>Open the teaching kit<\/b> when you are ready to explain it to someone else.<\/li><\/ol>
<h3>Set-up in two minutes<\/h3>
<div class="cmd"><pre>git clone https://github.com/vikramsankhala/hutter-casebook-lab\ncd hutter-casebook-lab\npip install -r requirements.txt\npython run_all.py                       # about one minute\npython scoreboard.py\npython -m unittest discover -s tests -v   # 18 tests<\/pre>${copyBtn('git clone https://github.com/vikramsankhala/hutter-casebook-lab\ncd hutter-casebook-lab\npip install -r requirements.txt\npython run_all.py\npython scoreboard.py\npython -m unittest discover -s tests -v')}<\/div>
<p>To run one experiment alone, use <code>python -m experiments.e03_copy_edits<\/code> (and so on). It rewrites only that experiment\'s JSON file. Avoid <code>python run_all.py e03_copy_edits<\/code> unless you mean it: that form replaces <code>all_results.json<\/code> with the single experiment.<\/p>
<div class="warn"><b>Before you say any number in public.<\/b> Every measured result comes from a synthetic corpus the code generates, not from enwik9. The numbers show how each mechanism behaves where the structure is known. They are not predictions for Wikipedia. Set <code>HCL_ENWIK<\/code> to a real enwik8 file to rerun on real text.<\/div>
<div class="plain"><b>Two numberings, one map.<\/b> The book has 18 cases; the code has 12 experiments (E01 to E12). Cases 1 to 6 share E01, E02 and the toolkit; Cases 7 to 16 each have their own experiment (E03 to E12); Cases 17 and 18 are the research agenda and the scoreboard. The <a href="#map">repository map<\/a> lines them up.<\/div>
<p><button class="act" onclick="location.hash='case-1'">Begin with Case 1<\/button><\/p>`}

 return `<h2>Repository map<\/h2><div class="breath">Every case, with the experiment and files that carry it. Click a row to open its walkthrough.<\/div><table><tr><th>Case<\/th><th>Idea<\/th><th>Exp.<\/th><th>Files to open<\/th><\/tr>${rows.join('')}<\/table>

function pageLecture(){return `<h2>Lecture kit<\/h2><div class="breath">A public lecture for a general university audience: ninety minutes, three live demonstrations, one rule ("subtract the control"), and a clear statement of what you are not claiming.<\/div>
<h3>The story to tell<\/h3><p>"Compression is prediction. The Hutter Prize turns that into a contest and counts every byte, including the program that unpacks the file. We built a small laboratory to test a dozen unusual ideas, from knot theory to physics, and we measured each one honestly. Some helped, some did not, and the way we measured is the lesson."<\/p>
<h3>Ninety-minute plan<\/h3><table class="tl"><tr><th>Time<\/th><th>Section<\/th><th>Cases<\/th><th>On screen<\/th><\/tr>
<tr><td>0–8<\/td><td>The contract: what the Prize rewards<\/td><td><a href="#case-1">1<\/a><\/td><td>The balance (payload versus decompressor); three referee numbers<\/td><\/tr>
<tr><td>8–22<\/td><td>Prediction, price of surprise, and the coder<\/td><td><a href="#case-2">2<\/a>, <a href="#case-3">3<\/a><\/td><td>Guessing game; cake-slicing diagram; <b>Demo 1<\/b><\/td><\/tr>
<tr><td>22–35<\/td><td>Context and mixing; the control habit<\/td><td><a href="#case-5">5<\/a>, <a href="#case-6">6<\/a><\/td><td>The ladder table; the three-arm picture<\/td><\/tr>
<tr><td>35–50<\/td><td>Planning and naming: copy-with-edits and grammars<\/td><td><a href="#case-7">7<\/a>, <a href="#case-8">8<\/a><\/td><td>Satnav analogy; the U-curve; <b>Demo 2<\/b><\/td><\/tr>
<tr><td>50–68<\/td><td>Shapes of data: geometry, energy, topology, harmonic analysis<\/td><td><a href="#case-9">9<\/a>–<a href="#case-12">12<\/a>, <a href="#case-14">14<\/a><\/td><td>Triangle of probabilities; nested brackets; the drum loop; <b>Demo 3<\/b><\/td><\/tr>
<tr><td>68–76<\/td><td>Quantum maths and lenses: interesting, and honest<\/td><td><a href="#case-13">13<\/a>, <a href="#case-15">15<\/a><\/td><td>Knot smoothings; the suitcase; the two totals<\/td><\/tr>
<tr><td>76–84<\/td><td>Physics and the scoreboard<\/td><td><a href="#case-16">16<\/a>, <a href="#case-18">18<\/a><\/td><td>Landauer number; the net-of-control table<\/td><\/tr>
<tr><td>84–90<\/td><td>What next; call to action<\/td><td><a href="#case-17">17<\/a><\/td><td>The nine untested ideas; "run it on enwik8"<\/td><\/tr><\/table>
<h3>Three live demonstrations<\/h3>
<div class="grid"><div class="card"><b>Demo 1 · Cheating by one line<\/b><p>In <code>hcl/models.py<\/code>, <code>cost_bits<\/code> scores before it learns. Swap the two lines on stage and rerun a small slice: the cost collapses. Say: "That is what leakage looks like, and it is why the rule exists."<\/p><\/div><div class="card"><b>Demo 2 · Greedy versus planned<\/b><p>Run <code>python -m experiments.e03_copy_edits<\/code>. Show 18,021 → 16,564 → 16,282 bytes. Say: "Looking ahead beat the greedy habit by about eight per cent."<\/p><\/div><div class="card"><b>Demo 3 · Finding the beat<\/b><p>Run <code>python -m experiments.e10_harmonic<\/code>. Show the detected period 28 and the drop from 2.0752 to 1.0792 bits per byte, against the control 1.6218. Say: "Structure pays where it exists."<\/p><\/div><\/div>
<h3>Slide outline (fourteen slides)<\/h3>
<ol class="steps"><li><b>Title and one-sentence promise.<\/b> "By the end you will be able to read a compression experiment and say whether to believe it."<\/li><li><b>The contract.<\/b> Payload plus decompressor equals S; at least 1% better to win.<\/li><li><b>Three ordinary referees.<\/b> zlib, bzip2, xz numbers.<\/li><li><b>The price of surprise.<\/b> −log₂ p, with the number line.<\/li><li><b>Score before you learn.<\/b> The three-line scorer.<\/li><li><b>Cutting the cake.<\/b> Arithmetic coding.<\/li><li><b>Context and backoff.<\/b> The ladder table.<\/li><li><b>Mixing and the three arms.<\/b> Mixer-only, candidate, noise control.<\/li><li><b>Planning beats greed.<\/b> The copy-with-edits totals.<\/li><li><b>Naming repeats.<\/b> The U-curve of rules.<\/li><li><b>A tour of unusual ideas.<\/b> One line each for Cases 9 to 16 with the net result.<\/li><li><b>The scoreboard.<\/b> Net of control; where structure paid.<\/li><li><b>What we are <i>not<\/i> claiming.<\/b> Synthetic corpus; no prediction for Wikipedia; quantum maths is not a speed-up.<\/li><li><b>Your turn.<\/b> Run it on enwik8; the nine untested ideas.<\/li><\/ol>
<h3>Shorter versions<\/h3><table><tr><th>Length<\/th><th>Cases to keep<\/th><th>Demos<\/th><\/tr><tr><td>20 minutes<\/td><td>1, 2, 6, 18<\/td><td>Demo 1 only<\/td><\/tr><tr><td>45 minutes<\/td><td>1, 2, 3, 5, 6, 7, 12, 14, 18<\/td><td>Demos 1 and 3<\/td><\/tr><\/table>
<h3>Questions you are likely to get<\/h3>
<details class="kit"><summary>Will any of this win the Prize?<\/summary><div class="in"><p>No, and the repository does not claim it. It is a laboratory for understanding why ideas work or fail. A real attempt needs a bit-level logistic mixer, many carefully chosen contexts, real data, a counted decoder, and fits within the time limit.<\/p><\/div><\/details>
<details class="kit"><summary>Why a synthetic corpus?<\/summary><div class="in"><p>It is small, reproducible and has known structure, so we can tell <i>why<\/i> an idea works. The price is that results do not transfer automatically; one environment variable switches to real enwik8.<\/p><\/div><\/details>
<details class="kit"><summary>Why do the physics and geometry ideas help so little?<\/summary><div class="in"><p>Some do not, and that is reported. The biggest net gains came where the generator contains the very structure the idea exploits. The honest conclusion is "matched structure pays", not "this branch of mathematics compresses text".<\/p><\/div><\/details>
<details class="kit"><summary>Why do top compressors use neural networks?<\/summary><div class="in"><p>They are strong predictors. But the weights count as part of the decompressor, so a large network has to save more than it costs. Case 17 lists this as an untested idea here.<\/p><\/div><\/details>
<details class="kit"><summary>Is lossless compression the same as understanding?<\/summary><div class="in"><p>The slogan is that predicting well requires modelling the source. But a table of prediction costs shows only how well a model fits, not that it understands. The Prize is a measurable proxy, which is why it is useful.<\/p><\/div><\/details>
<details class="kit"><summary>What was the biggest surprise?<\/summary><div class="in"><p>Two: the real arithmetic coder came out slightly <i>smaller<\/i> than the ideal sum, because its one-count minimum rescues rare bytes (Case 3), and the lens pipeline lost in spite of being perfectly lossless (Case 15).<\/p><\/div><\/details>
<h3>What to claim and what not to<\/h3>
<div class="grid"><div class="card"><b>Safe to say<\/b><p>"On this synthetic corpus, with this control, the net change was X." "The mechanism works where the structure exists." "The decoder is part of the bill."<\/p><\/div><div class="card"><b>Do not say<\/b><p>"This will compress Wikipedia better." "Quantum topology compresses text." "Langlands gives a compressor." None of these is shown.<\/p><\/div><\/div>
<h3>Preparation checklist<\/h3>
<ul><li>Run <code>python run_all.py<\/code> once the night before; keep the output window open.<\/li><li>Have the repository cloned locally, so the demos work without internet.<\/li><li>Print or save the scoreboard table as a slide.<\/li><li>Rehearse the one-line scorer swap (Demo 1) twice; undo it with <code>git checkout hcl/models.py<\/code>.<\/li><li>Keep the Complete Study App open in a tab for any question about theory.<\/li><\/ul>`}

const WORDS=[['Bit','The answer to one yes/no question. Eight bits make one byte.'],['Byte','One character of text, stored as a number from 0 to 255.'],['Bits per byte (bpb)','Average bits spent per character. Smaller is better; plain text is 8.'],['Surprise','How unexpected something was. Rarer events carry more surprise: −log₂ p bits.'],['Entropy','The average surprise for a source whose odds are known. The floor for compression.'],['Cross-entropy','The average surprise when you use your guessed odds instead of the true ones.'],['Model','A machine that, given the text so far, says how likely each next byte is.'],['Context','The few bytes just before the current one, used to guess what comes next.'],['Backoff','If you have not seen enough of a long context, lean on a shorter one.'],['Expert','One predictor among several that a mixer can blend.'],['Mixer','Learns how much to trust each expert and blends their odds.'],['Baseline','The plain version everything else is compared with.'],['Noise control','A fake candidate with the same size and shape but no real information. Its gain is the "free lunch" to subtract.'],['Net of control','Candidate gain minus control gain: the credit the idea truly earns.'],['Arithmetic coder','Turns probabilities into a bit string by shrinking an interval.'],['Decoder','The program that unpacks the file. In the Prize it is counted in the score.'],['Surrogate cost','A fixed price list standing in for a real coder to make comparisons simple.'],['Dynamic programming','Solve a big plan by solving smaller ones from the end backwards.'],['Description length','Total cost of the model plus the data described with it.'],['Lens','A reversible split into a simple view and the leftover complement.'],['Complement','What was removed by a view and must be kept to rebuild the original.'],['Born rule','Probabilities come from squaring amplitudes.'],['Betti number','Counts independent loops (b₁) or pieces (b₀) in a shape or graph.'],['Autocorrelation','How well a signal matches a shifted copy of itself; peaks show repeats.'],['Landauer bound','The least heat needed to erase one bit: kT ln 2.']];

 if(n===6)return `<div class="tool"><h5>Try it: net of control<\/h5><div class="sl"><label>Mixer-only: <b id="a_v">1.9859<\/b><\/label><input type="range" id="a" min="1.5" max="2.5" step="0.0001" value="1.9859"><label>Candidate: <b id="b_v">1.9526<\/b><\/label><input type="range" id="b" min="1.5" max="2.5" step="0.0001" value="1.9526"><label>Noise control: <b id="c_v">1.9709<\/b><\/label><input type="range" id="c" min="1.5" max="2.5" step="0.0001" value="1.9709"><\/div><div class="out" id="no"><\/div><\/div>`;
 return ''}
function wireWidget(n,r){
 if(n===2){const f=()=>{const p=+$('#p',r).value/100;$('#pv',r).textContent=p.toFixed(2);$('#po',r).textContent='Cost: '+(-Math.log2(p)).toFixed(2)+' bits'+(p<0.05?'  (a big surprise)':p>0.9?'  (barely a surprise)':'')};$('#p',r).oninput=f;f()}
 if(n===6){const f=()=>{const a=+$('#a',r).value,b=+$('#b',r).value,c=+$('#c',r).value;$('#a_v',r).textContent=a.toFixed(4);$('#b_v',r).textContent=b.toFixed(4);$('#c_v',r).textContent=c.toFixed(4);const pc=x=>100*(x-a)/a;const net=pc(b)-pc(c);$('#no',r).innerHTML='Candidate '+pc(b).toFixed(1)+'% · control '+pc(c).toFixed(1)+'% · <b>net '+net.toFixed(1)+'%<\/b>'+(net>=0?' — no real gain beyond the control.':'');};['a','b','c'].forEach(i=>$('#'+i,r).oninput=f);f()}}
